<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voltix Power10</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: #ffffff;
    }

    header {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(180deg, #000000, #111111);
    }

    h1 {
      color: #9cff00;
      font-size: 3em;
      margin: 0;
    }

    .slogan {
      font-size: 1.5em;
      margin-top: 10px;
    }

    section {
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }

    .highlight {
      color: #9cff00;
      font-weight: bold;
    }

    .box {
      border: 1px solid #9cff00;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
    }

    button {
      background:#9cff00;
      border:none;
      padding:12px 20px;
      cursor:pointer;
      border-radius:6px;
      font-weight:bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000000;
      font-size: 0.9em;
      color: #aaaaaa;
    }

    #modal {
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      justify-content:center;
      align-items:center;
      flex-direction:column;
    }

    #imgZoom {
      max-width:80%;
      max-height:80%;
      cursor:zoom-in;
      transition:0.3s;
    }

    .nav {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:30px;
      background:#9cff00;
      color:black;
      padding:10px;
      cursor:pointer;
      border-radius:50%;
    }

    #prev { left:20px; }
    #next { right:20px; }
  </style>
</head>
<body>

<header>
  <h1>VOLTIX</h1>
  <div class="slogan">Energia que te acompanha. Sempre.</div>
</header>

<section>
  <h2>Chega de depender de tomadas</h2>
  <p>Você já passou por aquela situação frustrante onde seu celular morre no pior momento?</p>
</section>

<section>
  <button onclick="abrirImagem()">Ver Imagens</button>
</section>

<div id="modal">
  <div id="prev" class="nav" onclick="mudarImagem(-1)">◀</div>
  <img id="imgZoom" src="Main.png">
  <div id="next" class="nav" onclick="mudarImagem(1)">▶</div>
  
  <button onclick="fecharImagem()" style="margin-top:20px;">Fechar</button>
</div>

<section style="text-align:center;">
  <a href="visualizador.html">
    <button>Ver Galeria de Imagens</button>
  </a>
</section>

<footer>
  Criado por Sawi Fox Studios<br>
  © 2026 Voltix - Todos os direitos reservados
</footer>

<script>
const imagens = ["Main.png", "Vitrine.png", "Visualizar.png"];
let index = 0;
let zoom = false;

function abrirImagem() {
  document.getElementById("modal").style.display = "flex";
  atualizarImagem();
}

function fecharImagem() {
  document.getElementById("modal").style.display = "none";
}

function mudarImagem(direcao) {
  index += direcao;

  if (index < 0) index = imagens.length - 1;
  if (index >= imagens.length) index = 0;

  atualizarImagem();
}

function atualizarImagem() {
  const img = document.getElementById("imgZoom");
  img.src = imagens[index];
  img.style.transform = "scale(1)";
  zoom = false;
}

const img = document.getElementById("imgZoom");

img.addEventListener("click", () => {
  if (!zoom) {
    img.style.transform = "scale(1.5)";
    img.style.cursor = "zoom-out";
  } else {
    img.style.transform = "scale(1)";
    img.style.cursor = "zoom-in";
  }
  zoom = !zoom;
});
</script>

</body>
</html>
